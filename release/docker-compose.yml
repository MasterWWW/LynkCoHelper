services:
  lynkco-helper:
    image: lynkco-helper-selfhosted:latest
    container_name: lynkco-helper
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    environment:
      TZ: "Asia/Shanghai"
      LYNKCO_ENV_FILE: "/data/env.json"
      LYNKCO_SCHEDULE_CRON: "${LYNKCO_SCHEDULE_CRON:-0 8 * * *}"
      LYNKCO_API_TOKEN: "${LYNKCO_API_TOKEN:-}"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
