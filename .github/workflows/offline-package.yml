name: offline-package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build offline package
        run: bash scripts/build-offline-package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lynkco-helper-offline
          path: |
            release/out/lynkco-helper-offline.zip
            release/out/lynkco-helper-offline.zip.sha256
          compression-level: 0
